<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Center for Philadelphia's Urban Future</title>
  <meta name="description" content="Building Philadelphia's urban future through technology, research, and civic engagement.">
  <meta property="og:title" content="Center for Philadelphia's Urban Future">
  <meta property="og:description" content="Building Philadelphia's urban future through technology, research, and civic engagement.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cpuf.org">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0c1a2a;
      --bg-grid: #132238;
      --text: #e8edf3;
      --text-muted: #8a9bb5;
      --accent: #3d8b8a;
      --accent-light: #5bbfbd;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Grid background — nod to Philly's street grid */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--bg-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.6;
      transform: rotate(-8deg) scale(1.4);
      pointer-events: none;
    }

    /* Subtle radial glow */
    body::after {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(61, 139, 138, 0.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 640px;
    }

    /* Logo placeholder — swap with <img> when ready */
    .logo-area {
      margin-bottom: 2rem;
    }

    .org-name {
      font-size: clamp(1.1rem, 3vw, 1.35rem);
      font-weight: 300;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .headline {
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
    }

    .headline em {
      font-style: normal;
      color: var(--accent-light);
    }

    .tagline {
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      font-weight: 300;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: var(--accent);
      margin: 0 auto 2rem;
      border: none;
    }

    .contact {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      justify-content: center;
      align-items: center;
      font-size: 0.9rem;
    }

    .contact a {
      color: var(--accent-light);
      text-decoration: none;
      transition: color 0.2s;
    }

    .contact a:hover {
      color: var(--text);
    }

  </style>
</head>
<body>
  <main>
    <div class="logo-area">
      <!-- Replace with <img src="logo.svg" alt="CPUF" width="..." height="..."> when logo is ready -->
    </div>

    <p class="org-name">Center for Philadelphia's Urban Future</p>
    <h1 class="headline"><em>Urban Future</em></h1>

    <p class="tagline">
      Building Philadelphia's urban future through technology,
      research, and civic engagement.
    </p>

    <hr class="divider">

    <div class="contact">
      <a href="mailto:phila.urban.future@gmail.com">phila.urban.future@gmail.com</a>
    </div>
  </main>
</body>
</html>
